<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>DX-Ball · LHDA</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #05070d;
    color: #f5f7fb;
    font-family: "Segoe UI", system-ui, sans-serif;
    gap: 12px;
    padding: 16px;
  }
  h1 {
    font-size: 1.25rem;
    letter-spacing: 0.08em;
    color: #e8c547;
  }
  #wrap {
    position: relative;
    box-shadow: 0 0 0 2px #1a2744, 0 0 0 3px #e8c54755, 0 12px 40px rgba(0,0,0,.55);
  }
  canvas {
    display: block;
    background: #0a1224;
    cursor: none;
    max-width: 100%;
    height: auto;
  }
  #ui {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(5,8,16,.92);
    text-align: center;
    padding: 24px;
    gap: 10px;
  }
  #ui.hidden { display: none; }
  #ui h2 { font-size: 1.5rem; color: #e8c547; margin-bottom: 8px; }
  #ui p { opacity: .85; font-size: .9rem; max-width: 320px; line-height: 1.4; }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 12px; }
  button {
    border: 1px solid #243556;
    background: #0d1830;
    color: #e8eef7;
    padding: 10px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: .9rem;
  }
  button:hover:not(:disabled) { background: #152444; border-color: #e8c547; }
  button:disabled { opacity: .35; cursor: not-allowed; }
  button.primary { background: #122040; border-color: #e8c547; color: #e8c547; }
  #hud {
    width: 640px;
    max-width: 100%;
    display: flex;
    justify-content: space-between;
    font-size: .85rem;
    font-variant-numeric: tabular-nums;
    color: #a8b4c8;
  }
  kbd {
    background: #0d1830;
    border: 1px solid #243556;
    border-radius: 3px;
    padding: 1px 5px;
    font-size: .75rem;
  }
</style>
</head>

  <h1>DX-BALL · LHDA</h1>

    <span id="hudMode">CLASSIC</span>

    </div>

const SAVE_KEYS = { CLASSIC: 'dx_classic', IMMORTAL: 'dx_immortal' };
const HS_KEYS = { CLASSIC: 'dx_hs_classic', IMMORTAL: 'dx_hs_immortal' };

let state = 'menu'; // menu | playing | paused | clear | gameover | win
let mode = 'CLASSIC';
let score = 0, lives = 3, levelIndex = 0;
let paddle, balls, bricks, powerups, particles;
let keys = {}, mouseX = W/2;
let stickyPending = true;
let clearTimer = 0;
let paddleMod = null; // expand|shrink|laser|sticky
let laserCooldown = 0;
let baseSpeed = 4.2;

/* --- Palandri SFX (rotate within group) --- */
const SFX_BASE = 'sfx/';
const SFX = { pala: [], ladrillo: [], power: [], muerte: [], clear: [] };
const sfxLast = { pala: -1, ladrillo: -1, power: -1, muerte: -1, clear: -1 };
let sfxReady = false;
let audioUnlocked = false;

async function loadSfx() {
  try {
    const res = await fetch(SFX_BASE + 'catalog.json');
    const cat = await res.json();
    const events = cat.events || cat;
    for (const [ev, files] of Object.entries(events)) {
      if (!Array.isArray(files)) continue;
      SFX[ev] = [];
      for (const f of files) {
        const a = new Audio(SFX_BASE + f);
        a.preload = 'auto';
        a.volume = 0.9;
        SFX[ev].push(a);
      }
      sfxLast[ev] = -1;
    }
    sfxReady = true;
  } catch (e) {
    console.warn('SFX catalog load failed', e);
  }
}

function unlockAudio() {
  if (audioUnlocked) return;
  audioUnlocked = true;
  // warm one buffer if available
  const any = Object.values(SFX).flat()[0];
  if (any) {
    const c = any.cloneNode();
    c.volume = 0;
    c.play().then(() => { c.pause(); }).catch(() => {});
  }
}

function playSfx(ev) {
  const list = SFX[ev];
  if (!list || !list.length) return;
  let i;
  if (list.length === 1) {
    i = 0;
  } else {
    i = Math.floor(Math.random() * list.length);
    if (i === sfxLast[ev]) i = (i + 1) % list.length;
  }
  sfxLast[ev] = i;
  const src = list[i];
  const a = src.cloneNode();
  a.volume = src.volume;
  a.play().catch(() => {});
}
loadSfx();


function loadSave(m) {
  try { return JSON.parse(localStorage.getItem(SAVE_KEYS[m]) || 'null'); }
  catch { return null; }
}
function saveGame() {
  const data = { levelIndex, score, lives, paddleMod, mode };
  localStorage.setItem(SAVE_KEYS[mode], JSON.stringify(data));
  refreshContinueBtns();
}
function clearSave(m) { localStorage.removeItem(SAVE_KEYS[m]); refreshContinueBtns(); }
function getHS(m) { return +(localStorage.getItem(HS_KEYS[m]) || 0); }
function setHS(m, v) {
  if (v > getHS(m)) localStorage.setItem(HS_KEYS[m], String(v));
}
function refreshContinueBtns() {
  document.getElementById('btnContClassic').disabled = !loadSave('CLASSIC');
  document.getElementById('btnContImmortal').disabled = !loadSave('IMMORTAL');
}

function makePaddle() {
  let w = 88;
  if (paddleMod === 'expand') w = 130;
  if (paddleMod === 'shrink') w = 56;
  return { x: W/2 - w/2, y: H - 36, w, h: 12 };
}
function makeBall(sticky) {
  return {
    x: paddle.x + paddle.w/2,
    y: paddle.y - 8,
    vx: 0, vy: 0,
    r: 6,
    sticky: !!sticky,
    fire: false
  };
}

/* Brick charset: '.'=0, '1'-'9'=1-9, 'A'-'M'=10-22 — exact BorodinART default.bds types */
const BDS_CHARS = '.123456789ABCDEFGHIJKLM';
const BDS_COLORS = {
  1:'#c0c0c0', 2:'#8a94a6', 3:'#e8c547', 4:'#d4a017', 5:'#b8860b',
  6:'#a8e6ff', 7:'#7ec8e3', 8:'#ff3b3b', 9:'#ff6b6b', 10:'#ff8c42',
  11:'#4da3ff', 12:'#3d7dd6', 13:'#9b59b6', 14:'#8e44ad', 15:'#2ecc71',
  16:'#27ae60', 17:'#e67e22', 18:'#f1c40f', 19:'#e74c3c', 20:'#1abc9c',
  21:'#95a5a6', 22:'#3498db'
};
function bdsType(ch) {
  const i = BDS_CHARS.indexOf(ch);
  return i < 0 ? 0 : i;
}
function buildLevel(idx) {
  const layout = LEVELS[idx % LEVELS.length];
  const rows = layout.rows;
  const cols = 20;
  const bw = 30, bh = 15;
  const ox = 20, oy = 50;
  bricks = [];
  for (let r = 0; r < rows.length; r++) {
    for (let c = 0; c < rows[r].length; c++) {
      const t = bdsType(rows[r][c]);
      if (!t) continue;
      let hp = 1, solid = false, bomb = false, softSteel = false;
      let color = BDS_COLORS[t] || '#4da3ff';
      if (t === 2) { solid = true; hp = 999; color = '#8a94a6'; }
      else if (t === 3) { hp = 3; color = '#e8c547'; }
      else if (t === 4) { hp = 2; color = '#d4a017'; }
      else if (t === 5) { hp = 1; color = '#b8860b'; }
      else if (t === 6) { hp = 1; color = '#a8e6ff'; }
      else if (t === 7) { hp = 2; color = '#7ec8e3'; }
      else if (t === 8) { hp = 1; bomb = true; color = '#ff3b3b'; }
      else if (t === 21) { hp = 1; softSteel = true; color = '#95a5a6'; }
      bricks.push({
        x: ox + c * bw, y: oy + r * bh, w: bw, h: bh,
        hp, solid, bomb, softSteel, type: t, col: c, row: r, color
      });
    }
  }
  baseSpeed = 4.2 + levelIndex * 0.18;
  if (baseSpeed > 7.5) baseSpeed = 7.5;
}

function startNew(m) {
  mode = m;
  score = 0;
  lives = m === 'IMMORTAL' ? Infinity : 3;
  levelIndex = 0;
  paddleMod = null;
  clearSave(m);
  beginLevel();
}
function continueMode(m) {
  const s = loadSave(m);
  if (!s) return;
  mode = m;
  score = s.score || 0;
  lives = m === 'IMMORTAL' ? Infinity : (s.lives ?? 3);
  levelIndex = s.levelIndex || 0;
  paddleMod = s.paddleMod || null;
  beginLevel();
}
function beginLevel() {
  paddle = makePaddle();
  balls = [makeBall(true)];
  powerups = [];
  particles = [];
  stickyPending = true;
  laserCooldown = 0;
  buildLevel(levelIndex);
  state = 'playing';
  ui.classList.add('hidden');
  updateHud();
  saveGame();
}

function updateHud() {
  document.getElementById('hudScore').textContent = 'Score: ' + score;
  document.getElementById('hudLevel').textContent = 'Level ' + (levelIndex + 1) + ' · ' + (LEVELS[levelIndex % LEVELS.length].name);
  document.getElementById('hudLives').textContent = 'Lives: ' + (lives === Infinity ? '∞' : lives);
  document.getElementById('hudMode').textContent = mode;
}

function launchBalls() {
  for (const b of balls) {
    if (b.sticky) {
      b.sticky = false;
      const angle = (-Math.PI / 2) + (Math.random() * 0.4 - 0.2);
      b.vx = Math.cos(angle) * baseSpeed;
      b.vy = Math.sin(angle) * baseSpeed;
    }
  }
  stickyPending = false;
}

function loseLife() {
  playSfx('muerte');
  if (mode === 'CLASSIC') {
    lives -= 1;
    if (lives <= 0) {
      setHS(mode, score);
      clearSave(mode);
      state = 'gameover';
      showMenu('GAME OVER', 'Score: ' + score + ' · Best: ' + getHS(mode));
      return;
    }
  }
  // IMMORTAL: still "lose life" feel but lives stay ∞
  paddleMod = paddleMod === 'laser' || paddleMod === 'sticky' ? null : paddleMod;
  paddle = makePaddle();
  balls = [makeBall(true)];
  stickyPending = true;
  powerups = [];
  updateHud();
  saveGame();
}

function destructibleLeft() {
  return bricks.some(b => !b.solid && b.hp > 0);
}

function spawnPower(x, y) {
  if (Math.random() > 0.28) return;
  const types = ['EXPAND','SHRINK','MULTI','SLOW','FAST','LASER','FIREBALL','STICKY','LIFE','SCORE'];
  const type = types[Math.floor(Math.random() * types.length)];
  powerups.push({ x, y, w: 28, h: 14, vy: 1.8, type });
}

function applyPower(type) {
  playSfx('power');
  score += 200;
  if (type === 'SCORE') { score += 800; return; }
  if (type === 'LIFE') {
    if (mode === 'CLASSIC' && lives < 9) lives += 1;
    else score += 500;
    return;
  }
  if (type === 'MULTI') {
    const extras = [];
    for (const b of balls) {
      if (b.sticky) continue;
      extras.push({ ...b, vx: b.vx * 0.8 + 1.2, vy: b.vy });
      extras.push({ ...b, vx: b.vx * 0.8 - 1.2, vy: b.vy });
    }
    balls.push(...extras.slice(0, 4));
    return;
  }
  if (type === 'SLOW') {
    for (const b of balls) { b.vx *= 0.75; b.vy *= 0.75; }
    return;
  }
  if (type === 'FAST') {
    for (const b of balls) { b.vx *= 1.25; b.vy *= 1.25; }
    return;
  }
  if (type === 'FIREBALL') {
    for (const b of balls) b.fire = true;
    return;
  }
  paddleMod = type === 'EXPAND' ? 'expand'
    : type === 'SHRINK' ? 'shrink'
    : type === 'LASER' ? 'laser'
    : type === 'STICKY' ? 'sticky'
    : paddleMod;
  const cx = paddle.x + paddle.w / 2;
  paddle = makePaddle();
  paddle.x = cx - paddle.w / 2;
}

function hitBrick(brick, fromBomb) {
  if (!brick || brick.solid || brick.hp <= 0) return false;
  // soft-steel (type 21): one hit then becomes invincible steel
  if (brick.softSteel) {
    playSfx('ladrillo');
    brick.softSteel = false;
    brick.solid = true;
    brick.hp = 999;
    brick.color = '#8a94a6';
    score += 50;
    return false;
  }
  brick.hp -= 1;
  playSfx('ladrillo');
  if (brick.hp <= 0) {
    score += (brick.bomb || brick.type === 3) ? 100 : 50;
    if (!fromBomb) spawnPower(brick.x + brick.w/2, brick.y + brick.h/2);
    brick.hp = 0;
    if (brick.bomb) {
      brick.bomb = false;
      for (const nb of bricks) {
        if (nb === brick || nb.hp <= 0) continue;
        if (Math.abs(nb.col - brick.col) <= 1 && Math.abs(nb.row - brick.row) <= 1) {
          hitBrick(nb, true);
        }
      }
    }
    return true;
  }
  // multi-hit visual step-down
  if (brick.hp === 2) brick.color = '#d4a017';
  else if (brick.hp === 1) brick.color = '#4da3ff';
  return false;
}

function reflectPaddle(ball) {
  const rel = (ball.x - paddle.x) / paddle.w; // 0..1
  const angle = (-Math.PI * 0.85) + rel * (Math.PI * 0.7);
  const spd = Math.min(Math.hypot(ball.vx, ball.vy) || baseSpeed, 8);
  ball.vx = Math.cos(angle) * spd;
  ball.vy = Math.sin(angle) * spd;
  if (ball.vy > -1.5) ball.vy = -Math.abs(spd * 0.7);
  if (paddleMod === 'sticky') {
    ball.sticky = true;
    stickyPending = true;
  }
}

function update(dt) {
  if (state === 'clear') {
    clearTimer -= dt;
    if (clearTimer <= 0) {
      levelIndex += 1;
      if (levelIndex >= LEVELS.length) {
        setHS(mode, score);
        clearSave(mode);
        state = 'win';
        showMenu('YOU WIN', 'Score: ' + score + ' · Best: ' + getHS(mode));
        return;
      }
      score += 1000 + 100 * levelIndex;
      paddleMod = null;
      beginLevel();
    }
    return;
  }
  if (state !== 'playing') return;

  // paddle move
  let px = mouseX - paddle.w / 2;
  if (keys['ArrowLeft'] || keys['a']) px = paddle.x - 7;
  if (keys['ArrowRight'] || keys['d']) px = paddle.x + 7;
  paddle.x = Math.max(0, Math.min(W - paddle.w, px));

  if (laserCooldown > 0) laserCooldown -= dt;

  for (const b of balls) {
    if (b.sticky) {
      b.x = paddle.x + paddle.w / 2;
      b.y = paddle.y - b.r - 1;
      continue;
    }
    b.x += b.vx;
    b.y += b.vy;

    // walls
    if (b.x - b.r < 0) { b.x = b.r; b.vx = Math.abs(b.vx); }
    if (b.x + b.r > W) { b.x = W - b.r; b.vx = -Math.abs(b.vx); }
    if (b.y - b.r < 0) { b.y = b.r; b.vy = Math.abs(b.vy); }

    // floor = lose life
    if (b.y - b.r > H) {
      b.dead = true;
    }

    // paddle
    if (b.vy > 0 &&
        b.y + b.r >= paddle.y && b.y - b.r <= paddle.y + paddle.h &&
        b.x >= paddle.x && b.x <= paddle.x + paddle.w) {
      b.y = paddle.y - b.r;
      reflectPaddle(b);
      playSfx('pala');
    }

    // bricks
    for (const br of bricks) {
      if (br.hp <= 0) continue;
      if (b.x + b.r > br.x && b.x - b.r < br.x + br.w &&
          b.y + b.r > br.y && b.y - b.r < br.y + br.h) {
        if (br.solid) {
          // bounce
          const overlapL = b.x + b.r - br.x;
          const overlapR = br.x + br.w - (b.x - b.r);
          const overlapT = b.y + b.r - br.y;
          const overlapB = br.y + br.h - (b.y - b.r);
          const minX = Math.min(overlapL, overlapR);
          const minY = Math.min(overlapT, overlapB);
          if (minX < minY) b.vx *= -1; else b.vy *= -1;
        } else if (b.fire) {
          hitBrick(br);
          // soft bounce keep fire going
          b.vy *= -1;
          b.fire = false;
        } else {
          const overlapL = b.x + b.r - br.x;
          const overlapR = br.x + br.w - (b.x - b.r);
          const overlapT = b.y + b.r - br.y;
          const overlapB = br.y + br.h - (b.y - b.r);
          const minX = Math.min(overlapL, overlapR);
          const minY = Math.min(overlapT, overlapB);
          if (minX < minY) b.vx *= -1; else b.vy *= -1;
          hitBrick(br);
        }
        break;
      }
    }
  }

  balls = balls.filter(b => !b.dead);
  if (balls.length === 0) loseLife();

  for (const p of powerups) {
    p.y += p.vy;
    if (p.y > H) p.dead = true;
    if (p.y + p.h >= paddle.y && p.x + p.w > paddle.x && p.x < paddle.x + paddle.w) {
      applyPower(p.type);
      p.dead = true;
    }
  }
  powerups = powerups.filter(p => !p.dead);
  bricks = bricks.filter(b => b.hp > 0 || b.solid);

  if (!destructibleLeft()) {
    state = 'clear';
    clearTimer = 120;
    playSfx('clear');
    saveGame();
  }
  updateHud();
}

function draw() {
  ctx.fillStyle = '#0a1224';
  ctx.fillRect(0, 0, W, H);

  // bricks
  for (const br of bricks) {
    if (br.hp <= 0 && !br.solid) continue;
    ctx.fillStyle = br.solid ? '#6b7385' : br.color;
    ctx.fillRect(br.x, br.y, br.w, br.h);
    ctx.strokeStyle = 'rgba(255,255,255,.15)';
    ctx.strokeRect(br.x + 0.5, br.y + 0.5, br.w - 1, br.h - 1);
    if (!br.solid && br.hp >= 2) {
      ctx.fillStyle = 'rgba(0,0,0,.25)';
      ctx.fillRect(br.x + 3, br.y + 3, br.w - 6, 4);
    }
  }

  // paddle
  ctx.fillStyle = paddleMod === 'laser' ? '#ff5c7a' : paddleMod === 'sticky' ? '#7dffa3' : '#d6e4ff';
  ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
  ctx.fillStyle = '#e8c547';
  ctx.fillRect(paddle.x, paddle.y, paddle.w, 3);

  // balls
  for (const b of balls) {
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fillStyle = b.fire ? '#ff9f43' : '#ffffff';
    ctx.fill();
  }

  // powerups
  for (const p of powerups) {
    ctx.fillStyle = '#222b3d';
    ctx.fillRect(p.x - p.w/2, p.y, p.w, p.h);
    ctx.strokeStyle = '#e8c547';
    ctx.strokeRect(p.x - p.w/2, p.y, p.w, p.h);
    ctx.fillStyle = '#e8c547';
    ctx.font = '9px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(p.type.slice(0, 4), p.x, p.y + 10);
  }

  if (state === 'clear') {
    ctx.fillStyle = 'rgba(0,0,0,.45)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#e8c547';
    ctx.font = 'bold 28px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('LEVEL CLEAR', W/2, H/2);
  }
  if (state === 'paused') {
    ctx.fillStyle = 'rgba(0,0,0,.5)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#e8eef7';
    ctx.font = 'bold 28px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('PAUSED', W/2, H/2);
  }

  // tip sticky
  if (state === 'playing' && balls.some(b => b.sticky)) {
    ctx.fillStyle = 'rgba(255,255,255,.5)';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Click / Espacio para lanzar', W/2, H - 10);
  }
}

function loop() {
  update(1);
  draw();
  requestAnimationFrame(loop);
}

function showMenu(title, sub) {
  ui.classList.remove('hidden');
  ui.querySelector('h2').textContent = title || 'DX-BALL';
  msg.textContent = sub || '';
  refreshContinueBtns();
  state = title === 'GAME OVER' || title === 'YOU WIN' ? state : 'menu';
}

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const scale = canvas.width / rect.width;
  mouseX = (e.clientX - rect.left) * scale;
});
canvas.addEventListener('click', () => {
  unlockAudio();
  if (state === 'playing') launchBalls();
});
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ' || e.code === 'Space') {
    e.preventDefault();
    if (state === 'playing') launchBalls();
  }
  if (e.key === 'p' || e.key === 'P') {
    if (state === 'playing') state = 'paused';
    else if (state === 'paused') state = 'playing';
  }
  // laser fire
  if ((e.key === 'f' || e.key === 'F') && paddleMod === 'laser' && state === 'playing' && laserCooldown <= 0) {
    laserCooldown = 18;
    // simple laser: damage brick above paddle center
    const lx = paddle.x + paddle.w / 2;
    for (let i = bricks.length - 1; i >= 0; i--) {
      const br = bricks[i];
      if (br.hp <= 0) continue;
      if (lx >= br.x && lx <= br.x + br.w && br.y < paddle.y) {
        if (!br.solid) hitBrick(br);
        break;
      }
    }
  }
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

document.getElementById('btnClassic').onclick = () => { unlockAudio(); startNew('CLASSIC'); };
document.getElementById('btnImmortal').onclick = () => { unlockAudio(); startNew('IMMORTAL'); };
document.getElementById('btnContClassic').onclick = () => { unlockAudio(); continueMode('CLASSIC'); };
document.getElementById('btnContImmortal').onclick = () => { unlockAudio(); continueMode('IMMORTAL'); };

refreshContinueBtns();
msg.textContent = 'Best CLASSIC: ' + getHS('CLASSIC') + ' · Best IMMORTAL: ' + getHS('IMMORTAL');
paddle = makePaddle();
balls = [];
bricks = [];
powerups = [];
loop();
</script>
</body>
</html>
